name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  mesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install --no-save yaml || true
      - name: crosswalk — canary × loom (the mesh must hold)
        run: node mesh/crosswalk.mjs
      - name: poly-gan bazaar — trade + weave + honest verdict
        run: node mesh/bazaar.mjs
      - uses: actions/upload-artifact@v4
        with: { name: mesh-receipts, path: outputs/ }
